[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --html=reports/report.html --self-contained-html -v
markers =
    smoke: Quick smoke tests for basic functionality
    regression: Comprehensive regression tests
    checkout: Tests for checkout functionality
    wishlist: Tests for wishlist functionality
    contact: Tests for contact form functionality
    login: Tests for login functionality